<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Семейное древо</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        background: linear-gradient(
          145deg,
          #0f0c29 0%,
          #1a1a2e 25%,
          #16213e 50%,
          #1a1a2e 75%,
          #0f0c29 100%
        );
        color: #fff;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        position: relative;
        font-family: "Segoe UI", sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        will-change: transform;
      }

      /* Разрешаем выделение только в полях ввода */
      input,
      textarea,
      .form-input,
      [contenteditable="true"] {
        user-select: text;
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
      }

      /* Отключаем перетаскивание изображений */
      img,
      .photo,
      .details-photo-img,
      .details-photo-gif {
        -webkit-user-drag: none;
        -khtml-user-drag: none;
        -moz-user-drag: none;
        -o-user-drag: none;
        pointer-events: none;
      }

      /* Контейнер для звездного неба */
      #starfield {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1;
        overflow: hidden;
      }

      /* Слой 1: Дальние звезды (мелкие, медленные) */
      .stars-layer-1 {
        position: absolute;
        width: 300%;
        height: 300%;
        background-image:
          radial-gradient(
            1px 1px at calc(1% * var(--random-x1)) calc(1% * var(--random-y1)),
            rgba(255, 255, 255, 0.6) 1px,
            transparent 2px
          ),
          radial-gradient(
            1px 1px at calc(1% * var(--random-x2)) calc(1% * var(--random-y2)),
            rgba(255, 255, 255, 0.5) 1px,
            transparent 2px
          ),
          radial-gradient(
            1px 1px at calc(1% * var(--random-x3)) calc(1% * var(--random-y3)),
            rgba(255, 255, 255, 0.4) 1px,
            transparent 2px
          ),
          radial-gradient(
            1px 1px at calc(1% * var(--random-x4)) calc(1% * var(--random-y4)),
            rgba(255, 255, 255, 0.5) 1px,
            transparent 2px
          ),
          radial-gradient(
            1px 1px at calc(1% * var(--random-x5)) calc(1% * var(--random-y5)),
            rgba(255, 255, 255, 0.3) 1px,
            transparent 2px
          ),
          radial-gradient(
            1px 1px at calc(1% * var(--random-x6)) calc(1% * var(--random-y6)),
            rgba(255, 255, 255, 0.6) 1px,
            transparent 2px
          ),
          radial-gradient(
            1px 1px at calc(1% * var(--random-x7)) calc(1% * var(--random-y7)),
            rgba(255, 255, 255, 0.4) 1px,
            transparent 2px
          ),
          radial-gradient(
            1px 1px at calc(1% * var(--random-x8)) calc(1% * var(--random-y8)),
            rgba(255, 255, 255, 0.5) 1px,
            transparent 2px
          ),
          radial-gradient(
            1px 1px at calc(1% * var(--random-x9)) calc(1% * var(--random-y9)),
            rgba(255, 255, 255, 0.3) 1px,
            transparent 2px
          ),
          radial-gradient(
            1px 1px at calc(1% * var(--random-x10)) calc(1% * var(--random-y10)),
            rgba(255, 255, 255, 0.6) 1px,
            transparent 2px
          );
        background-size: 500px 500px;
        opacity: 0.4;
        animation: twinkle-slow 15s infinite ease-in-out;
        transform-origin: center center;
      }

      /* Слой 2: Средние звезды */
      .stars-layer-2 {
        position: absolute;
        width: 400%;
        height: 400%;
        background-image:
          radial-gradient(
            1.5px 1.5px at calc(1% * var(--random-x11))
              calc(1% * var(--random-y11)),
            rgba(255, 255, 255, 0.8) 1px,
            transparent 2px
          ),
          radial-gradient(
            1.5px 1.5px at calc(1% * var(--random-x12))
              calc(1% * var(--random-y12)),
            rgba(255, 255, 255, 0.7) 1px,
            transparent 2px
          ),
          radial-gradient(
            1.5px 1.5px at calc(1% * var(--random-x13))
              calc(1% * var(--random-y13)),
            rgba(255, 255, 255, 0.9) 1px,
            transparent 2px
          ),
          radial-gradient(
            1.5px 1.5px at calc(1% * var(--random-x14))
              calc(1% * var(--random-y14)),
            rgba(255, 255, 255, 0.6) 1px,
            transparent 2px
          ),
          radial-gradient(
            1.5px 1.5px at calc(1% * var(--random-x15))
              calc(1% * var(--random-y15)),
            rgba(255, 255, 255, 0.8) 1px,
            transparent 2px
          ),
          radial-gradient(
            1.5px 1.5px at calc(1% * var(--random-x16))
              calc(1% * var(--random-y16)),
            rgba(255, 255, 255, 0.7) 1px,
            transparent 2px
          ),
          radial-gradient(
            1.5px 1.5px at calc(1% * var(--random-x17))
              calc(1% * var(--random-y17)),
            rgba(255, 255, 255, 0.9) 1px,
            transparent 2px
          ),
          radial-gradient(
            1.5px 1.5px at calc(1% * var(--random-x18))
              calc(1% * var(--random-y18)),
            rgba(255, 255, 255, 0.6) 1px,
            transparent 2px
          );
        background-size: 800px 800px;
        opacity: 0.6;
        animation: twinkle-medium 12s infinite ease-in-out;
        transform-origin: center center;
      }

      /* Слой 3: Ближние звезды (крупные, яркие) */
      .stars-layer-3 {
        position: absolute;
        width: 600%;
        height: 600%;
        background-image:
          radial-gradient(
            2px 2px at calc(1% * var(--random-x19)) calc(1% * var(--random-y19)),
            rgba(255, 255, 255, 1) 1px,
            transparent 2px
          ),
          radial-gradient(
            2px 2px at calc(1% * var(--random-x20)) calc(1% * var(--random-y20)),
            rgba(255, 255, 255, 0.9) 1px,
            transparent 2px
          ),
          radial-gradient(
            3px 3px at calc(1% * var(--random-x21)) calc(1% * var(--random-y21)),
            rgba(255, 255, 255, 1) 1px,
            transparent 2px
          ),
          radial-gradient(
            2px 2px at calc(1% * var(--random-x22)) calc(1% * var(--random-y22)),
            rgba(255, 255, 255, 0.9) 1px,
            transparent 2px
          ),
          radial-gradient(
            3px 3px at calc(1% * var(--random-x23)) calc(1% * var(--random-y23)),
            rgba(255, 255, 255, 1) 1px,
            transparent 2px
          ),
          radial-gradient(
            2px 2px at calc(1% * var(--random-x24)) calc(1% * var(--random-y24)),
            rgba(255, 255, 255, 0.9) 1px,
            transparent 2px
          );
        background-size: 1200px 1200px;
        opacity: 0.8;
        animation: twinkle-fast 8s infinite ease-in-out;
        transform-origin: center center;
      }

      /* Цветные звезды (редкие) */
      .stars-layer-colors {
        position: absolute;
        width: 500%;
        height: 500%;
        background-image:
          radial-gradient(
            2px 2px at calc(1% * var(--random-x25)) calc(1% * var(--random-y25)),
            rgba(173, 216, 230, 0.8) 1px,
            transparent 2px
          ),
          radial-gradient(
            2px 2px at calc(1% * var(--random-x26)) calc(1% * var(--random-y26)),
            rgba(221, 160, 221, 0.8) 1px,
            transparent 2px
          ),
          radial-gradient(
            2px 2px at calc(1% * var(--random-x27)) calc(1% * var(--random-y27)),
            rgba(135, 206, 250, 0.8) 1px,
            transparent 2px
          ),
          radial-gradient(
            3px 3px at calc(1% * var(--random-x28)) calc(1% * var(--random-y28)),
            rgba(255, 182, 193, 0.8) 1px,
            transparent 2px
          ),
          radial-gradient(
            2px 2px at calc(1% * var(--random-x29)) calc(1% * var(--random-y29)),
            rgba(144, 238, 144, 0.8) 1px,
            transparent 2px
          );
        background-size: 1500px 1500px;
        opacity: 0.5;
        animation: twinkle-colors 20s infinite ease-in-out;
        transform-origin: center center;
      }

      #treeContainer {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        cursor: grab;
      }

      #treeContainer.grabbing {
        cursor: grabbing;
      }

      #treeContainer.dragging-person {
        cursor: default;
      }

      #tree {
        position: absolute;
        min-width: 2000px;
        min-height: 1200px;
        transform-origin: 0 0;
      }

      .generation {
        position: absolute;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .person {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: absolute;
        cursor: pointer;
        transition: filter 0.2s;
        z-index: 10;
        pointer-events: auto;
        transform-origin: center center;
      }

      .person.dragging {
        z-index: 100;
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
        cursor: grabbing;
      }

      .person:hover {
        filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
      }

      .person.active {
        filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.7));
      }

      .photo-container {
        width: 90px;
        height: 120px;
        border-radius: 8px;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.1);
        background-color: rgba(40, 40, 40, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px;
        position: relative;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: auto;
      }

      .person:hover .photo-container {
        border-color: rgba(255, 255, 255, 0.4);
        transform: translateY(-2px);
      }

      .person.active .photo-container {
        border-color: rgba(255, 255, 255, 0.7);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      }

      .photo {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .no-photo {
        font-size: 32px;
        color: rgba(255, 255, 255, 0.3);
      }

      .name {
        font-weight: 500;
        font-size: 14px;
        text-align: center;
        max-width: 140px;
        color: #f0f0f0;
        background-color: rgba(0, 0, 0, 0.25);
        padding: 4px 8px;
        border-radius: 6px;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        width: 140px;
        min-height: 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        line-height: 1.2;
      }

      .surname {
        font-size: 13px;
        font-weight: 600;
      }

      .firstname {
        font-size: 11px;
        margin: 1px 0;
        font-weight: normal;
      }

      .middlename {
        font-size: 11px;
        color: #d0d0d0;
        font-weight: normal;
      }

      .tree-connections {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: 0;
        pointer-events: none;
        overflow: visible;
      }

      .line-path {
        fill: none;
        stroke: rgba(255, 255, 255, 0.25);
        stroke-width: 2;
        filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.2));
      }

      .heart-symbol {
        fill: rgba(255, 105, 180, 0.8);
        filter: drop-shadow(0 0 5px rgba(255, 105, 180, 0.6));
      }

      .details-panel {
        position: absolute;
        width: 320px;
        background: rgba(30, 30, 30, 0.95);
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        z-index: 100;
        opacity: 0;
        transform: translateY(-10px) scale(0.95);
        transition:
          opacity 0.15s,
          transform 0.15s;
        pointer-events: none;
        box-shadow:
          0 20px 40px rgba(0, 0, 0, 0.3),
          0 10px 20px rgba(0, 0, 0, 0.2),
          0 0 0 1px rgba(255, 255, 255, 0.05);
      }

      .details-panel.active {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: auto;
      }

      .details-photo {
        width: 280px;
        height: 340px;
        border-radius: 8px;
        overflow: hidden;
        margin: 0 auto 15px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        background-color: rgba(40, 40, 40, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .details-photo-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .details-name {
        font-size: 1.3rem;
        text-align: center;
        margin-bottom: 15px;
        color: #f0f0f0;
        line-height: 1.3;
      }

      .details-surname {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }

      .details-firstname {
        display: block;
        font-size: 12px;
        margin: 2px 0;
        font-weight: normal;
      }

      .details-middlename {
        display: block;
        font-size: 12px;
        color: #d0d0d0;
        font-weight: normal;
      }

      .details-info {
        margin-top: 15px;
      }

      .info-item {
        margin-bottom: 10px;
        padding-bottom: 10px;
      }

      .info-item:last-child {
        border-bottom: none;
        padding-bottom: 0;
        margin-bottom: 0;
      }

      .info-label {
        font-weight: 500;
        color: #a0a0a0;
        display: block;
        margin-bottom: 5px;
        font-size: 0.85rem;
      }

      .info-value {
        color: #fff;
        font-size: 0.95rem;
      }

      .controls {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 50;
        display: flex;
        gap: 10px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }

      .controls.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .control-btn {
        padding: 10px 20px;
        background: rgba(30, 30, 30, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        border-radius: 8px;
        cursor: pointer;
        backdrop-filter: blur(5px);
        transition: background 0.3s;
        font-weight: 500;
        font-size: 14px;
      }

      .control-btn:hover {
        background: rgba(60, 60, 60, 0.9);
      }

      .notification {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(30, 30, 30, 0.9);
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 14px;
        color: #fff;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 1000;
        pointer-events: none;
      }

      .notification.show {
        opacity: 1;
      }

      .edit-panel,
      .save-version-panel,
      .load-version-panel {
        position: fixed;
        background: rgba(35, 35, 35, 0.98);
        border-radius: 10px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        z-index: 200;
        opacity: 0;
        transform: translateY(-20px) scale(0.9);
        transition:
          opacity 0.2s,
          transform 0.2s;
        pointer-events: none;
        max-height: 85vh;
        overflow-y: auto;
      }

      /* Отключаем контекстное меню на изображениях */
      img {
        -webkit-touch-callout: none;
      }

      .edit-panel.active,
      .save-version-panel.active,
      .load-version-panel.active {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: auto;
      }

      .edit-panel {
        width: 420px;
      }

      .save-version-panel {
        width: 400px;
      }

      .load-version-panel {
        width: 500px;
        max-height: 70vh;
      }

      .edit-form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .form-label {
        font-weight: 500;
        color: #a0a0a0;
        font-size: 0.9rem;
      }

      .form-input {
        padding: 10px;
        background: rgba(50, 50, 50, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        color: white;
        font-size: 14px;
        transition: border-color 0.3s;
      }

      .form-input:focus {
        outline: none;
        border-color: rgba(255, 105, 180, 0.5);
      }

      .form-buttons {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .form-btn {
        padding: 10px 15px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        font-size: 13px;
        transition: background 0.3s;
        flex: 1;
      }

      .save-btn {
        background: rgba(255, 105, 180, 0.8);
        color: white;
      }

      .save-btn:hover {
        background: rgba(255, 105, 180, 1);
      }

      .cancel-btn {
        background: rgba(100, 100, 100, 0.8);
        color: white;
      }

      .cancel-btn:hover {
        background: rgba(120, 120, 120, 1);
      }

      .delete-btn {
        background: rgba(220, 53, 69, 0.8);
        color: white;
      }

      .delete-btn:hover {
        background: rgba(220, 53, 69, 1);
      }

      .parents-selection {
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        padding: 10px;
        background: rgba(50, 50, 50, 0.5);
      }

      .version-list {
        margin-top: 15px;
        max-height: 300px;
        overflow-y: auto;
      }

      .version-item {
        background: rgba(50, 50, 50, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: background 0.3s;
      }

      .version-item:hover {
        background: rgba(70, 70, 70, 0.8);
      }

      .version-name {
        font-weight: 500;
        font-size: 16px;
      }

      .version-date {
        font-size: 12px;
        color: #a0a0a0;
        margin-top: 5px;
      }

      .version-info {
        font-size: 12px;
        color: #a0a0a0;
        margin-top: 3px;
      }

      .file-input-container {
        margin-top: 10px;
      }

      .file-input-label {
        display: inline-block;
        padding: 8px 12px;
        background: rgba(255, 105, 180, 0.6);
        color: white;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.3s;
        font-size: 13px;
      }

      .file-input-label:hover {
        background: rgba(255, 105, 180, 0.8);
      }

      .file-input {
        display: none;
      }

      .spouse-pair {
        display: flex;
        align-items: center;
        margin: 0 40px;
        position: relative;
      }

      .spouse-pair .person {
        margin: 0 10px;
      }

      .edit-profession-btn {
        background: rgba(190, 190, 190, 0.3);
        border: none;
        padding: 3px 3px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        margin-left: 10px;
        transition: background 0.3s;
      }

      .edit-profession-btn:hover {
        background: rgba(190, 190, 190, 0.6);
      }

      .hearts-panel {
        margin-top: 10px;
        padding-top: 10px;
      }

      .hearts-list {
        max-height: 150px;
        overflow-y: auto;
        margin-bottom: 10px;
      }

      .heart-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px;
        background: rgba(50, 50, 50, 0.5);
        border-radius: 4px;
        margin-bottom: 5px;
      }

      .heart-names {
        font-size: 13px;
      }

      .remove-heart-btn {
        background: rgba(220, 53, 69, 0.6);
        color: white;
        border: none;
        padding: 3px 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
      }

      .remove-heart-btn:hover {
        background: rgba(220, 53, 69, 0.8);
      }

      .add-heart-section {
        margin-top: 10px;
        display: flex;
      }

      .parents-columns {
        display: flex;
        gap: 15px;
      }

      .parents-column {
        flex: 1;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        overflow: hidden;
        max-height: 200px;
      }

      .parents-column-title {
        background: rgba(255, 105, 180, 0.2);
        padding: 8px 12px;
        font-weight: 500;
        text-align: center;
        color: rgba(255, 255, 255, 0.9);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .parents-list {
        max-height: 150px;
        overflow-y: auto;
        padding: 10px;
      }

      .parent-checkbox {
        margin-bottom: 8px;
        padding: 6px 8px;
        border-radius: 4px;
        transition: background 0.2s;
      }

      .parent-checkbox:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .parent-checkbox label {
        display: flex;

  <body>
    <div class="controls" id="controls">
      <button class="control-btn" id="saveBtn">
        <i class="fas fa-save"></i> Сохранить
      </button>
      <button class="control-btn" id="loadBtn">
        <i class="fas fa-folder-open"></i> Загрузить
      </button>
      <button class="control-btn" id="addBtn">
        <i class="fas fa-user-plus"></i> Добавить
      </button>
    </div>

    <div class="tree-container" id="treeContainer">
      <div class="tree" id="tree"></div>
    </div>

    <div class="hint">
      <i class="fas fa-mouse-pointer"></i> ЛКМ — перемещение | Колесико —
      масштаб | Клик по человеку — показать/скрыть детали | Ё - возврат масштаба
    </div>
    <div class="notification" id="notification"></div>

    <script>
      // Добавьте в начале скрипта
      let isPageVisible = true;

      // Оптимизация при скрытии вкладки
      document.addEventListener("visibilitychange", function () {
        isPageVisible = !document.hidden;

        if (!isPageVisible) {
          // При скрытии вкладки останавливаем анимации
          document.body.style.animationPlayState = "paused";
        } else {
          document.body.style.animationPlayState = "running";
        }
      });

      const defaultFamilyMembers = [];
      const PRELOAD_TREE_FILE = "FamilyTree.json";

      let scale = 1;
      let offsetX = 0;
      let offsetY = 0;
      let isDragging = false;
      let startX, startY;
      let activePersonId = null;
      let detailsPanel = null;
      let svgContainer = null;
      let familyMembers = [];
      let nextId = 1;
      let maxGeneration = 1;
      let isMouseOverPanel = false;
      let isDraggingPerson = false;
      let draggedPerson = null;
      let dragOffsetX = 0;
      let dragOffsetY = 0;
      let editMode = false;
      let isMouseOverPerson = false;
      let clickTimer = null;
      let isClick = true;
      let parentsPage = { male: 1, female: 1 };
      let childrenPage = 1;
      const ITEMS_PER_PAGE = 4;

      // Добавьте эту функцию в начале скрипта (после объявления переменных)
      function preventImageDrag() {
        // Отключаем dragstart для всех изображений
        document.addEventListener("dragstart", function (e) {
          if (e.target.tagName === "IMG") {
            e.preventDefault();
            return false;
          }
        });

        // Отключаем контекстное меню на изображениях
        document.addEventListener("contextmenu", function (e) {
          if (e.target.tagName === "IMG") {
            e.preventDefault();
            return false;
          }
        });

        // Добавляем атрибуты для изображений
        document.querySelectorAll("img").forEach((img) => {
          img.setAttribute("draggable", "false");
          img.style.pointerEvents = "none";
        });
      }

      // Вызываем функцию при загрузке
      window.addEventListener("DOMContentLoaded", function () {
        preventImageDrag();
        // ... остальной код инициализации ...
      });

      function initializeData() {
        familyMembers = [...defaultFamilyMembers];
        nextId = 1;
        maxGeneration = 1;
      }

      function rebindAllEventListeners() {
        // Удаляем старые обработчики
        document.removeEventListener("keydown", handleGlobalKeydown);

        // Добавляем новые
        addEventListeners();
        bindControlButtons();

        // Перепривязываем обработчик для Ctrl+Alt
        document.addEventListener("keydown", handleGlobalKeydown);
      }

      function handleGlobalKeydown(e) {
        if (e.ctrlKey && e.altKey) {
          e.preventDefault();
          toggleEditMode();
        }

        if (e.key === "F5") {
          e.preventDefault();
          drawConnections();
          showNotification("Линии обновлены");
        }

        if (e.key === "Escape") {
          e.preventDefault();
          hidePersonDetails();
          hideAddHeartPanel();
          hideSaveVersionPanel();
          hideLoadVersionsPanel();
          hideAddPersonForm();
          hideEditPhotoPanel();
        }
        if (
          e.key === "`" ||
          e.key === "~" ||
          e.key === "ё" ||
          e.key === "Ё" ||
          e.keyCode === 192 ||
          e.keyCode === 221
        ) {
          e.preventDefault();
          resetToDefaultZoom();
        }
      }

      async function loadInitialTree() {
        if (PRELOAD_TREE_FILE) {
          try {
            const response = await fetch(PRELOAD_TREE_FILE);
            if (!response.ok) throw new Error("Файл не найден");
            const data = await response.json();
            if (!data.members || !Array.isArray(data.members))
              throw new Error("Неверный формат файла");

            familyMembers = data.members;
            nextId =
              data.nextId || Math.max(...familyMembers.map((m) => m.id)) + 1;
            maxGeneration =
              data.maxGeneration ||
              Math.max(...familyMembers.map((m) => m.generation));

            familyMembers.forEach((member, index) => {
              if (member.x === undefined || member.y === undefined) {
                const generation = member.generation || 1;
                const genMembers = familyMembers.filter(
                  (m) => m.generation === generation,
                );
                const memberIndex = genMembers.findIndex(
                  (m) => m.id === member.id,
                );
                member.x = (memberIndex - (genMembers.length - 1) / 2) * 250;
                member.y = (generation - 1) * 300;
              }
            });

            generateFamilyTree();
            showNotification(
              `Загружено дерево из файла: "${PRELOAD_TREE_FILE}"`,
            );
          } catch (error) {
            console.error("Ошибка загрузки начального дерева:", error);
            initializeData();
            generateFamilyTree();
          }
        } else {
          initializeData();
          generateFamilyTree();
        }
      }

      function showNotification(message, duration = 800) {
        const notification = document.getElementById("notification");
        notification.textContent = message;
        notification.classList.add("show");
        setTimeout(() => notification.classList.remove("show"), duration);
      }

      function generateFamilyTree() {
        const tree = document.getElementById("tree");
        const treeContainer = document.getElementById("treeContainer");
        tree.innerHTML = "";

        // Создаем основной контейнер для всего содержимого дерева
        const treeContent = document.createElement("div");
        treeContent.style.position = "absolute";
        treeContent.style.width = "100%";
        treeContent.style.height = "100%";
        treeContent.style.transformOrigin = "0 0";
        treeContent.id = "treeContent";

        // Создаем SVG для линий (он должен быть первым, чтобы быть под иконками)
        svgContainer = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "svg",
        );
        svgContainer.className = "tree-connections";
        svgContainer.id = "connections";
        svgContainer.style.width = "100%";
        svgContainer.style.height = "100%";
        svgContainer.style.position = "absolute";
        svgContainer.style.top = "0";
        svgContainer.style.left = "0";
        svgContainer.style.zIndex = "0";
        svgContainer.style.pointerEvents = "none";
        svgContainer.style.overflow = "visible";
        treeContent.appendChild(svgContainer);

        const generationDiv = document.createElement("div");
        generationDiv.className = "generation";
        generationDiv.id = "all-generations";
        generationDiv.style.position = "absolute";
        generationDiv.style.width = "100%";
        generationDiv.style.height = "100%";
        generationDiv.style.zIndex = "1";
        treeContent.appendChild(generationDiv);

        const pairedPeople = new Set();
        const pairGroups = [];

        familyMembers.forEach((member) => {
          if (
            member.loves &&
            member.loves.length > 0 &&
            !pairedPeople.has(member.id)
          ) {
            member.loves.forEach((lovedId) => {
              const lovedPerson = familyMembers.find((m) => m.id === lovedId);
              if (
                lovedPerson &&
                lovedPerson.loves &&
                lovedPerson.loves.includes(member.id)
              ) {
                pairedPeople.add(member.id);
                pairedPeople.add(lovedId);
                pairGroups.push([member.id, lovedId]);
              }
            });
          }
        });

        const generationMembers = {};
        familyMembers.forEach((member) => {
          const generation = member.generation || 1;
          if (!generationMembers[generation])
            generationMembers[generation] = [];
          generationMembers[generation].push(member);
        });

        Object.keys(generationMembers)
          .sort((a, b) => a - b)
          .forEach((generation) => {
            const members = generationMembers[generation];
            const pairedInThisGeneration = members.filter((m) =>
              pairedPeople.has(m.id),
            );
            const unpairedInThisGeneration = members.filter(
              (m) => !pairedPeople.has(m.id),
            );

            let pairXPosition =
              -(pairedInThisGeneration.length / 2 - 0.5) * 200;
            pairedInThisGeneration.forEach((member, index) => {
              const pairMember = pairGroups.find((pair) =>
                pair.includes(member.id),
              );
              if (pairMember) {
                const partnerId =
                  pairMember[0] === member.id ? pairMember[1] : pairMember[0];
                const partner = familyMembers.find((m) => m.id === partnerId);

                if (member.x === undefined || member.y === undefined) {
                  member.x = pairXPosition - 60;
                  member.y = (generation - 1) * 300;
                }

                if (
                  partner &&
                  (partner.x === undefined || partner.y === undefined)
                ) {
                  partner.x = pairXPosition + 60;
                  partner.y = (generation - 1) * 300;
                }

                pairXPosition += 200;
              }
            });

            let singleXPosition =
              -(unpairedInThisGeneration.length / 2 - 0.5) * 300;
            unpairedInThisGeneration.forEach((member, index) => {
              if (member.x === undefined || member.y === undefined) {
                member.x = singleXPosition;
                member.y = (generation - 1) * 300;
                singleXPosition += 300;
              }
            });
          });

        familyMembers.forEach((member) => {
          const personDiv = createPersonElement(member);
          if (member.x !== undefined && member.y !== undefined) {
            personDiv.style.left = `${member.x}px`;
            personDiv.style.top = `${member.y}px`;
          }
          generationDiv.appendChild(personDiv);
        });

        tree.appendChild(treeContent);

        if (!detailsPanel) createDetailsPanel();

        setTimeout(() => {
          drawConnections();
          rebindAllEventListeners();
          updateControlsVisibility();
        }, 50);
      }

      function createPersonElement(member) {
        const personDiv = document.createElement("div");
        personDiv.className = "person";
        personDiv.id = `person-${member.id}`;
        personDiv.dataset.id = member.id;

        if (activePersonId === member.id) {
          personDiv.classList.add("active");
        }

        const photoContainer = document.createElement("div");
        photoContainer.className = "photo-container";
        photoContainer.style.borderColor = member.photoColor || "#aaaaaa";

        if (member.photo) {
          const photoImg = document.createElement("img");
          photoImg.className = "photo";
          photoImg.src = member.photo;
          photoImg.setAttribute("draggable", "false"); // Отключаем перетаскивание
          photoImg.style.pointerEvents = "none"; // Отключаем события мыши
          photoContainer.appendChild(photoImg);
        } else {
          const noPhotoIcon = document.createElement("i");
          noPhotoIcon.className = "fas fa-user no-photo";
          photoContainer.appendChild(noPhotoIcon);
        }

        const nameDiv = document.createElement("div");
        nameDiv.className = "name";
        nameDiv.innerHTML = `
    <span class="surname">${member.surname}</span>
    <span class="firstname">${member.firstname}</span>
    <span class="middlename">${member.middlename}</span>
  `;

        personDiv.appendChild(photoContainer);
        personDiv.appendChild(nameDiv);
        return personDiv;
      }

      function createDetailsPanel() {
        detailsPanel = document.createElement("div");
        detailsPanel.className = "details-panel";
        detailsPanel.id = "detailsPanel";
        document.body.appendChild(detailsPanel);
      }

      function updateDetailsPanelContent() {
        if (!detailsPanel) return;
        const person = activePersonId
          ? familyMembers.find((m) => m.id === activePersonId)
          : null;
        const hasPair = person && person.loves && person.loves.length > 0;

        const heartsSection =
          editMode && !hasPair
            ? `
                        <div class="add-heart-section">
                            <button class="form-btn save-btn" id="addHeartBtn">
                                <i class="fas fa-heart"></i> Добавить пару
                            </button>
                        </div>
                    `
            : "";

        const deleteButton = editMode
          ? `
          <div class="add-heart-section">
                        <button class="form-btn delete-btn" id="deletePersonBtn">
                            <i class="fas fa-trash"></i> Удалить человека
                        </button>
                        </div>
                    `
          : "";

        const editProfessionButton = editMode
          ? '<button class="edit-profession-btn" id="editProfessionBtn">✏️</button>'
          : "";

        // Добавляем кнопки редактирования фото в режиме редактирования
        const editPhotoButtons = editMode
          ? `
                        <div class="form-buttons">
                            <button class="form-btn save-btn" id="editIconPhotoBtn">
                                <i class="fas fa-camera"></i> Изменить фото
                            </button>
                        </div>
                    `
          : "";

        detailsPanel.innerHTML = `
                    <div class="details-photo" id="detailsPhoto"><i class="fas fa-user no-photo"></i></div>
                    <h3 class="details-name" id="detailsName">
                        <span class="details-surname" id="detailsSurname"></span>
                        <span class="details-firstname" id="detailsFirstname"></span>
                        <span class="details-middlename" id="detailsMiddlename"></span>
                    </h3>
                    <div class="details-info">
                        <div class="info-item"><span class="info-label">Дата рождения:</span><span class="info-value" id="detailsBirthDate">Не указано</span></div>
                        <div class="info-item"><span class="info-label">Место рождения:</span><span class="info-value" id="detailsBirthPlace">Не указано</span></div>
                        <div class="info-item"><span class="info-label">Профессия:</span><span class="info-value" id="detailsProfession">Не указано</span>${editProfessionButton}</div>
                        <div class="info-item"><span class="info-label">Пол:</span><span class="info-value" id="detailsGender">Не указано</span></div>
                    </div>
                    
                    <div class="hearts-panel" id="heartsPanel">
                        <div class="info-label">Пара:</div>
                        <div class="hearts-list" id="heartsList"></div>
                        ${heartsSection}
                    </div>
                    ${editPhotoButtons}
                    ${deleteButton}
                `;
      }

      function drawConnections() {
        if (!svgContainer) return;

        // Очищаем SVG
        while (svgContainer.firstChild) {
          svgContainer.removeChild(svgContainer.firstChild);
        }

        // Получаем контейнер дерева
        const tree = document.getElementById("tree");
        const treeContent = document.getElementById("treeContent");
        if (!tree || !treeContent) return;

        // Создаем группу для линий
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        svgContainer.appendChild(g);

        // Рисуем линии любви (пары)
        familyMembers.forEach((member) => {
          if (member.loves && member.loves.length > 0) {
            member.loves.forEach((lovedId) => {
              const lovedPerson = familyMembers.find((m) => m.id === lovedId);
              if (
                lovedPerson &&
                lovedPerson.loves &&
                lovedPerson.loves.includes(member.id)
              ) {
                const person1 = document.getElementById(`person-${member.id}`);
                const person2 = document.getElementById(`person-${lovedId}`);

                if (person1 && person2) {
                  // Получаем абсолютные координаты центров иконок
                  const person1Rect = person1.getBoundingClientRect();
                  const person2Rect = person2.getBoundingClientRect();

                  // Центр иконки: left + ширина иконки/2
                  const person1CenterX =
                    person1Rect.left + person1Rect.width / 2;
                  const person1CenterY =
                    person1Rect.top + person1Rect.height / 2;
                  const person2CenterX =
                    person2Rect.left + person2Rect.width / 2;
                  const person2CenterY =
                    person2Rect.top + person2Rect.height / 2;

                  // Получаем позицию SVG относительно viewport
                  const svgRect = svgContainer.getBoundingClientRect();

                  // Преобразуем координаты в пространство SVG
                  const heartX =
                    (person1CenterX + person2CenterX) / 2 - svgRect.left;
                  const heartY =
                    (person1CenterY + person2CenterY) / 2 - svgRect.top;

                  drawHeart(g, heartX, heartY);
                }
              }
            });
          }
        });

        // Рисуем линии родители-дети
        const parentPairsMap = new Map();
        familyMembers.forEach((member) => {
          if (member.parents && member.parents.length >= 2) {
            const sortedParents = [...member.parents].sort((a, b) => a - b);
            const key = sortedParents.join("-");
            if (!parentPairsMap.has(key))
              parentPairsMap.set(key, { parents: sortedParents, children: [] });
            parentPairsMap.get(key).children.push(member.id);
          }
        });

        parentPairsMap.forEach((pair, key) => {
          const [parent1Id, parent2Id] = pair.parents;
          const parent1 = document.getElementById(`person-${parent1Id}`);
          const parent2 = document.getElementById(`person-${parent2Id}`);

          if (parent1 && parent2) {
            // Получаем абсолютные координаты
            const parent1Rect = parent1.getBoundingClientRect();
            const parent2Rect = parent2.getBoundingClientRect();
            const svgRect = svgContainer.getBoundingClientRect();

            // Нижний центр иконки родителя
            const parent1X =
              parent1Rect.left + parent1Rect.width / 2 - svgRect.left;
            const parent1Y = parent1Rect.bottom - svgRect.top;
            const parent2X =
              parent2Rect.left + parent2Rect.width / 2 - svgRect.left;
            const parent2Y = parent2Rect.bottom - svgRect.top;

            const connectX = (parent1X + parent2X) / 2;
            const connectY = Math.max(parent1Y, parent2Y) + 40;

            drawElegantLine(g, parent1X, parent1Y, connectX, connectY, "left");
            drawElegantLine(g, parent2X, parent2Y, connectX, connectY, "right");

            pair.children.forEach((childId, index) => {
              const child = document.getElementById(`person-${childId}`);
              if (child) {
                const childRect = child.getBoundingClientRect();
                // Верхний центр иконки ребенка
                const childX =
                  childRect.left + childRect.width / 2 - svgRect.left;
                const childY = childRect.top - svgRect.top;

                drawElegantLine(
                  g,
                  connectX,
                  connectY,
                  childX,
                  childY,
                  "child",
                  index,
                  pair.children.length,
                );
              }
            });
          }
        });

        // Рисуем линии для одиночных родителей
        familyMembers.forEach((parent) => {
          if (parent.children && parent.children.length > 0) {
            let isPartOfPair = false;
            parentPairsMap.forEach((pair) => {
              if (pair.parents.includes(parent.id)) isPartOfPair = true;
            });

            if (!isPartOfPair) {
              const parentElement = document.getElementById(
                `person-${parent.id}`,
              );
              if (parentElement) {
                const parentRect = parentElement.getBoundingClientRect();
                const svgRect = svgContainer.getBoundingClientRect();

                // Нижний центр иконки родителя
                const parentX =
                  parentRect.left + parentRect.width / 2 - svgRect.left;
                const parentY = parentRect.bottom - svgRect.top;

                parent.children.forEach((childId, index) => {
                  const child = document.getElementById(`person-${childId}`);
                  if (child) {
                    const childRect = child.getBoundingClientRect();
                    // Верхний центр иконки ребенка
                    const childX =
                      childRect.left + childRect.width / 2 - svgRect.left;
                    const childY = childRect.top - svgRect.top;

                    drawElegantLine(
                      g,
                      parentX,
                      parentY,
                      childX,
                      childY,
                      "single",
                      index,
                      parent.children.length,
                    );
                  }
                });
              }
            }
          }
        });
      }

      function drawElegantLine(
        svg,
        x1,
        y1,
        x2,
        y2,
        type = "normal",
        childIndex = 0,
        totalChildren = 1,
      ) {
        const path = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "path",
        );
        let controlX1, controlY1, controlX2, controlY2;
        const offset = 30;

        if (type === "left") {
          controlX1 = x1 - offset;
          controlY1 = y1 + 60;
          controlX2 = x2 - 20;
          controlY2 = y2 - 20;
        } else if (type === "right") {
          controlX1 = x1 + offset;
          controlY1 = y1 + 60;
          controlX2 = x2 + 20;
          controlY2 = y2 - 20;
        } else if (type === "child" || type === "single") {
          const waveAmplitude = 20;
          const wavePhase = (childIndex - (totalChildren - 1) / 2) * 0.5;
          controlX1 = x1 + (x2 - x1) * 0.3 + wavePhase * waveAmplitude;
          controlY1 = y1 + (y2 - y1) * 0.3 - waveAmplitude;
          controlX2 = x2 - (x2 - x1) * 0.3 + wavePhase * waveAmplitude;
          controlY2 = y2 - (y2 - y1) * 0.3 + waveAmplitude;
        } else {
          controlX1 = x1 + (x2 - x1) * 0.5;
          controlY1 = y1 + (y2 - y1) * 0.3;
          controlX2 = x2 - (x2 - x1) * 0.5;
          controlY2 = y2 - (y2 - y1) * 0.3;
        }

        const d = `M ${x1} ${y1} C ${controlX1} ${controlY1}, ${controlX2} ${controlY2}, ${x2} ${y2}`;
        path.setAttribute("d", d);
        path.classList.add("line-path");
        svg.appendChild(path);
      }

      function drawHeart(svg, x, y) {
        const heartSize = 12;
        const heart = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "path",
        );
        const heartPath = `M ${x} ${y - heartSize / 2} C ${x - heartSize} ${y - heartSize}, ${x - heartSize} ${y + heartSize / 2}, ${x} ${y + heartSize} C ${x + heartSize} ${y + heartSize / 2}, ${x + heartSize} ${y - heartSize}, ${x} ${y - heartSize / 2} Z`;
        heart.setAttribute("d", heartPath);
        heart.classList.add("heart-symbol");
        svg.appendChild(heart);
      }

      function addEventListeners() {
        const treeContainer = document.getElementById("treeContainer");
        const personElements = document.querySelectorAll(".person");

        personElements.forEach((person) => {
          const newPerson = person.cloneNode(true);
          person.parentNode.replaceChild(newPerson, person);

          newPerson.addEventListener("mousedown", function (e) {
            if (e.button === 0) {
              isClick = true;
              clickTimer = setTimeout(() => {
                isClick = false;

                if (editMode) {
                  e.preventDefault();
                  e.stopPropagation();
                  const id = parseInt(this.dataset.id);
                  const member = familyMembers.find((m) => m.id === id);
                  if (!member) return;

                  isDraggingPerson = true;
                  draggedPerson = this;
                  draggedPerson.classList.add("dragging");
                  treeContainer.classList.add("dragging-person");

                  const rect = this.getBoundingClientRect();
                  const treeRect = document
                    .getElementById("treeContainer")
                    .getBoundingClientRect();

                  const elementLeft = rect.left - treeRect.left;
                  const elementTop = rect.top - treeRect.top;

                  dragOffsetX = (e.clientX - rect.left) / scale;
                  dragOffsetY = (e.clientY - rect.top) / scale;
                }
              }, 200);
            }
          });

          // В обработчике mouseup для person:
          newPerson.addEventListener("mouseup", function (e) {
            if (e.button === 0) {
              clearTimeout(clickTimer);

              if (isClick && !isDraggingPerson) {
                const id = parseInt(this.dataset.id);

                if (activePersonId === id) {
                  hidePersonDetails();
                } else {
                  showPersonDetails(id);
                }
              }

              if (isDraggingPerson) {
                isClick = false;
                e.preventDefault();
                const id = parseInt(draggedPerson.dataset.id);
                const member = familyMembers.find((m) => m.id === id);
                if (member) {
                  // Обновляем координаты в объекте
                  member.x = parseFloat(draggedPerson.style.left);
                  member.y = parseFloat(draggedPerson.style.top);
                  // Перерисовываем линии
                  setTimeout(() => {
                    drawConnections();
                  }, 10);
                  showNotification(
                    `Позиция ${member.surname} ${member.firstname} обновлена`,
                  );
                }
                draggedPerson.classList.remove("dragging");
                isDraggingPerson = false;
                draggedPerson = null;
                treeContainer.classList.remove("dragging-person");
              }
            }
          });

          newPerson.addEventListener("mouseenter", function (e) {
            isMouseOverPerson = true;
          });

          newPerson.addEventListener("mouseleave", function (e) {
            isMouseOverPerson = false;
          });
        });

        treeContainer.addEventListener("mousedown", function (e) {
          if (e.button === 0 && !isDraggingPerson && !isMouseOverPerson) {
            const panel = document.getElementById("detailsPanel");
            const isClickOnPanel = panel && panel.contains(e.target);

            if (!isClickOnPanel && !isMouseOverPerson) {
              hidePersonDetails();
            }

            e.preventDefault();
            isDragging = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
            treeContainer.classList.add("grabbing");
          }
        });

        treeContainer.addEventListener("wheel", function (e) {
          e.preventDefault();

          // Используем requestIdleCallback если доступен
          const scheduleUpdate =
            window.requestIdleCallback || requestAnimationFrame;

          const zoomSpeed = 0.0001;
          const oldScale = scale;
          const delta = e.deltaY > 0 ? -1 : 1;
          scale += delta * zoomSpeed * 100;
          scale = Math.max(0.1, Math.min(5, scale));

          const visibleRect = treeContainer.getBoundingClientRect();
          const visibleCenterX = visibleRect.width / 2;
          const visibleCenterY = visibleRect.height / 2;

          const scaleDiff = scale / oldScale;
          offsetX = visibleCenterX - (visibleCenterX - offsetX) * scaleDiff;
          offsetY = visibleCenterY - (visibleCenterY - offsetY) * scaleDiff;

          // Используем оптимизированное обновление
          scheduleUpdate(() => {
            updateTreePosition();
            updatePanelPosition();

            // Перерисовываем линии только при значительном изменении масштаба
            if (Math.abs(oldScale - scale) > 0.1) {
              drawConnections();
            }
          });
        });

        document.addEventListener("mousemove", function (e) {
          if (isDraggingPerson && draggedPerson) {
            e.preventDefault();

            const treeContainerRect = treeContainer.getBoundingClientRect();
            const mouseX = e.clientX - treeContainerRect.left;
            const mouseY = e.clientY - treeContainerRect.top;

            const elementX = (mouseX - offsetX) / scale - dragOffsetX;
            const elementY = (mouseY - offsetY) / scale - dragOffsetY;

            draggedPerson.style.left = `${elementX}px`;
            draggedPerson.style.top = `${elementY}px`;

            updatePanelPosition();

            // Перерисовываем линии с небольшой задержкой для производительности
            if (Date.now() % 3 === 0) {
              // Перерисовываем каждые 3 кадра
              requestAnimationFrame(() => {
                drawConnections();
              });
            }
          } else if (isDragging) {
            offsetX = e.clientX - startX;
            offsetY = e.clientY - startY;
            updateTreePosition(); // Эта функция теперь обновляет и звезды
            updatePanelPosition();
          }
        });

        document.addEventListener("mouseup", function (e) {
          if (isDragging) {
            isDragging = false;
            treeContainer.classList.remove("grabbing");
          }
        });

        bindControlButtons();

        window.addEventListener("resize", () => {
          updateTreePosition();
          drawConnections();
          updatePanelPosition();
        });

        document.addEventListener("keydown", function (e) {
          if (e.ctrlKey && e.altKey) {
            e.preventDefault();
            toggleEditMode();
          }

          if (e.key === "F5") {
            e.preventDefault();
            drawConnections();
            showNotification("Линии обновлены");
          }

          if (e.key === "Escape") {
            e.preventDefault();
            hidePersonDetails();
            hideAddHeartPanel();
            hideSaveVersionPanel();
            hideLoadVersionsPanel();
            hideAddPersonForm();
            hideEditPhotoPanel();
          }
          if (
            e.key === "`" ||
            e.key === "~" ||
            e.key === "ё" ||
            e.key === "Ё" ||
            e.keyCode === 192 ||
            e.keyCode === 221
          ) {
            e.preventDefault();
            resetToDefaultZoom();
          }
        });

        // Перепривязка глобального обработчика для Ctrl+Alt
        document.addEventListener("keydown", function (e) {
          if (e.ctrlKey && e.altKey) {
            e.preventDefault();
            toggleEditMode();
          }

          if (e.key === "F5") {
            e.preventDefault();
            drawConnections();
            showNotification("Линии обновлены");
          }

          if (e.key === "Escape") {
            e.preventDefault();
            hidePersonDetails();
            hideAddHeartPanel();
            hideSaveVersionPanel();
            hideLoadVersionsPanel();
            hideAddPersonForm();
            hideEditPhotoPanel();
          }
        });
      }

      function removeHeart(personId, lovedId) {
        const person = familyMembers.find((m) => m.id === personId);
        const lovedPerson = familyMembers.find((m) => m.id === lovedId);
        if (person && lovedPerson) {
          if (person.loves)
            person.loves = person.loves.filter((id) => id !== lovedId);
          if (lovedPerson.loves && lovedPerson.loves.includes(personId))
            lovedPerson.loves = lovedPerson.loves.filter(
              (id) => id !== personId,
            );
          drawConnections();
          updateHeartsList(personId);
          showNotification("Пара удалена");
        }
      }

          .addEventListener("submit", function (e) {

                lovedPerson.loves.length > 0
              ) {
                showNotification("У выбранного человека уже есть пара");
                return;
              }

      function addHeart(personId, lovedId, isMutual = false) {
        const person = familyMembers.find((m) => m.id === personId);
        const lovedPerson = familyMembers.find((m) => m.id === lovedId);
        if (person && lovedPerson) {
          if (
            (person.loves && person.loves.length > 0) ||
            (lovedPerson.loves && lovedPerson.loves.length > 0)
          ) {
            showNotification("У одного из людей уже есть пара");
            return;
          }
          if (!person.loves) person.loves = [];
          person.loves.push(lovedId);
          if (isMutual) {
            if (!lovedPerson.loves) lovedPerson.loves = [];
            lovedPerson.loves.push(personId);
          }
          if (person.x !== undefined && lovedPerson.x !== undefined) {
            const midX = (person.x + lovedPerson.x) / 2;
            const midY = (person.y + lovedPerson.y) / 2;
            person.x = midX - 60;
            lovedPerson.x = midX + 60;
            person.y = midY;
            lovedPerson.y = midY;
          }
          generateFamilyTree();
          updateHeartsList(personId);
          showNotification("Пара добавлена");
        }
      }

        const member = familyMembers.find((m) => m.id === personId);

        // Создаем панель для загрузки фото
        const editPhotoPanel = document.createElement("div");
        editPhotoPanel.className = "edit-panel";
        editPhotoPanel.id = "editPhotoPanel";
        editPhotoPanel.innerHTML = `
            <h3 style="margin-bottom: 20px; color: #fff;">

            </h3>
            <div style="color: #fff; margin-bottom: 15px;">

                    <input type="file" class="file-input" id="newPhotoInput" accept="image/*">

            </div>

            <div style="font-size: 12px; color: #a0a0a0; margin-top: 10px;">
               Рекомендуемый размер: 900×1200px (будет автоматически масштабировано)
            </div>
            <div class="form-buttons" style="margin-top: 20px;">
                <button type="button" class="form-btn save-btn" id="savePhotoBtn">Сохранить</button>
                <button type="button" class="form-btn cancel-btn" id="cancelPhotoBtn">Отмена</button>
                ${
                  member.photo
                    ? `<button type="button" class="form-btn delete-btn" id="removePhotoBtn">Удалить фото</button>`
                    : ""
                }
            </div>
        `;

        document.body.appendChild(editPhotoPanel);

        editPhotoPanel.style.left = "50%";
        editPhotoPanel.style.top = "50%";
        editPhotoPanel.style.transform = "translate(-50%, -50%) scale(0.9)";

        setTimeout(() => {
          editPhotoPanel.classList.add("active");
        }, 10);

        let compressedPhotoData = null;

        // Обработчик выбора файла
        document
          .getElementById("newPhotoInput")
          .addEventListener("change", function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const previewDiv = document.getElementById("photoPreview");
            previewDiv.innerHTML =
              '<div style="color: #a0a0a0; font-size: 12px; padding: 10px;">Обработка изображения...</div>';

            const reader = new FileReader();
            reader.onload = function (e) {
              const img = new Image();
              img.onload = function () {
                const canvas = document.createElement("canvas");
                const ctx = canvas.getContext("2d");

                // Размеры в зависимости от типа фото
                const targetWidth = photoType === "icon" ? 900 : 1800;
                const targetHeight = photoType === "icon" ? 1200 : 2400;

                canvas.width = targetWidth;
                canvas.height = targetHeight;

                // Белый фон
                ctx.fillStyle = "white";
                ctx.fillRect(0, 0, targetWidth, targetHeight);

                // Масштабирование с сохранением пропорций
                const imgRatio = img.width / img.height;
                const targetRatio = targetWidth / targetHeight;

                let drawWidth, drawHeight, offsetX, offsetY;

                if (imgRatio > targetRatio) {
                  drawHeight = targetHeight;
                  drawWidth = targetHeight * imgRatio;
                  offsetX = (targetWidth - drawWidth) / 2;
                  offsetY = 0;
                } else {
                  drawWidth = targetWidth;
                  drawHeight = targetWidth / imgRatio;
                  offsetX = 0;
                  offsetY = (targetHeight - drawHeight) / 2;
                }

                ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);

                // Сохраняем сжатое изображение
                compressedPhotoData = canvas.toDataURL("image/jpeg", 0.7);

                // Показываем превью
                previewDiv.innerHTML = "";
                const previewImg = document.createElement("img");
                previewImg.src = compressedPhotoData;
                previewImg.style.maxWidth = "150px";
                previewImg.style.maxHeight = "150px";
                previewImg.style.borderRadius = "4px";
                previewImg.style.border = "1px solid rgba(255, 255, 255, 0.2)";
                previewImg.setAttribute("draggable", "false");
                previewImg.style.pointerEvents = "none";
                previewDiv.appendChild(previewImg);
              };
              img.src = e.target.result;
            };
            reader.readAsDataURL(file);
          });

        // Обработчик сохранения
        document
          .getElementById("savePhotoBtn")
          .addEventListener("click", function () {
            if (compressedPhotoData) {
              // Обновляем фото (одно фото для обоих мест)
              member.photo = compressedPhotoData;

              // Обновляем отображение
              generateFamilyTree();
              if (activePersonId === personId) {
                showPersonDetails(personId);
              }

              showNotification("Фото обновлено");
              hideEditPhotoPanel();
            } else {
              showNotification("Выберите новое фото");
            }
          });

        // Обработчик удаления фото
        const removePhotoBtn = document.getElementById("removePhotoBtn");
        if (removePhotoBtn) {
          removePhotoBtn.addEventListener("click", function () {
            // Удаляем фото
            member.photo = null;

            // Обновляем отображение
            generateFamilyTree();
            if (activePersonId === personId) {
              showPersonDetails(personId);
            }

            showNotification("Фото удалено");
            hideEditPhotoPanel();
          });
        }

        // Обработчик отмены
        document
          .getElementById("cancelPhotoBtn")
          .addEventListener("click", hideEditPhotoPanel);

        function hideEditPhotoPanel() {
          editPhotoPanel.classList.remove("active");
          setTimeout(() => {
            if (editPhotoPanel.parentNode) {
              editPhotoPanel.parentNode.removeChild(editPhotoPanel);
            }
          }, 200);
        }
      }

      function hideEditPhotoPanel() {

        if (editPhotoPanel) {
          editPhotoPanel.classList.remove("active");

            }

      function deletePerson(id) {
        const member = familyMembers.find((m) => m.id === id);
        if (!member) return;
        familyMembers.forEach((m) => {
          if (m.loves && m.loves.includes(id))
            m.loves = m.loves.filter((lovedId) => lovedId !== id);
          if (m.parents && m.parents.includes(id))
            m.parents = m.parents.filter((parentId) => parentId !== id);
          if (m.children && m.children.includes(id))
            m.children = m.children.filter((childId) => childId !== id);
          if (m.spouse === id) m.spouse = null;
        });
        familyMembers = familyMembers.filter((m) => m.id !== id);
        hidePersonDetails();
        generateFamilyTree();
        showNotification(
          `Удален: ${member.surname} ${member.firstname} ${member.middlename}`,
        );
      }

      function saveToFile(versionName) {
        const dataToSave = {
          date: new Date().toISOString(),
          membersCount: familyMembers.length,
          maxGeneration: maxGeneration,
          nextId: nextId,
          members: familyMembers.map((member) => {
            const compressedMember = { ...member };
            delete compressedMember.compressedPhoto;
            delete compressedMember.compressedGif;
            return compressedMember;
          }),
        };

        const dataStr = JSON.stringify(dataToSave, null, 2);
        const dataBlob = new Blob([dataStr], { type: "application/json" });

        const fileName = `${versionName}.json`;

        const url = URL.createObjectURL(dataBlob);
        const link = document.createElement("a");
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showNotification(`Файл "${versionName}.json" сохранен`);
      }

      function loadFromFile(file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          try {
            const data = JSON.parse(e.target.result);
            if (!data.members || !Array.isArray(data.members))
              throw new Error("Неверный формат файла");

            familyMembers = data.members;
            nextId =
              data.nextId || Math.max(...familyMembers.map((m) => m.id)) + 1;
            maxGeneration =
              data.maxGeneration ||
              Math.max(...familyMembers.map((m) => m.generation));

            generateFamilyTree();

            setTimeout(() => {
              addEventListeners();
              updateControlsVisibility();
            }, 100);

            hideLoadVersionsPanel();

            const fileName = file.name.replace(".json", "");
            showNotification(`Загружен файл: "${fileName}"`);

            // editMode = false;
            // updateControlsVisibility();

            if (activePersonId) {
              hidePersonDetails();
            }
          } catch (error) {
            console.error("Ошибка загрузки файла:", error);
            showNotification("Ошибка загрузки файла. Проверьте формат файла.");
          }
        };
        reader.onerror = function () {
          showNotification("Ошибка чтения файла");
        };
        reader.readAsText(file);
      }

      function getPaginatedItems(items, page, itemsPerPage) {
        const start = (page - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        return {
          items: items.slice(start, end),
          totalPages: Math.ceil(items.length / itemsPerPage),
          currentPage: page,
        };
      }

      function updateParentsLists(generation) {
        const maleParentsList = document.getElementById("maleParentsList");
        const femaleParentsList = document.getElementById("femaleParentsList");
        if (!maleParentsList || !femaleParentsList) return;

        const maleParents = familyMembers.filter(
          (m) => m.gender === "male" && m.generation === generation - 1,
        );
        const femaleParents = familyMembers.filter(
          (m) => m.gender === "female" && m.generation === generation - 1,
        );

        const malePaginated = getPaginatedItems(
          maleParents,
          parentsPage.male,
          ITEMS_PER_PAGE,
        );
        const femalePaginated = getPaginatedItems(
          femaleParents,
          parentsPage.female,
          ITEMS_PER_PAGE,
        );

        maleParentsList.innerHTML = "";
        femaleParentsList.innerHTML = "";

        malePaginated.items.forEach((parent) => {
          const checkbox = document.createElement("div");
          checkbox.className = "parent-checkbox";
          checkbox.innerHTML = `
      <label>
        <input type="radio" name="maleParent" value="${parent.id}" class="parent-checkbox-input"

               ${document.querySelector('input[name="femaleParent"]:checked')?.value == parent.id ? "checked" : ""}>

      </label>
    `;

        const malePagination = maleParentsList.parentElement.querySelector(

        if (malePaginated.totalPages > 1) {

            <select class="form-input" id="addGeneration" style="flex: 1; appearance: none;">

                <input type="file" class="file-input" id="addPhoto" accept="image/*">
              </label>
              <div id="addPhotoPreview" style="margin-top: 10px;"></div>
            </div>

          <div class="form-group"><label class="form-label">Родители:</label>

                <div class="parents-column">
                  <div class="parents-column-title">Мужчины (поколение ${maxGeneration - 1 > 0 ? maxGeneration - 1 : 0})</div>
                  <div class="parents-list" id="maleParentsList"></div>
                </div>
                <div class="parents-column">
                  <div class="parents-column-title">Женщины (поколение ${maxGeneration - 1 > 0 ? maxGeneration - 1 : 0})</div>
                  <div class="parents-list" id="femaleParentsList"></div>
                </div>
              </div>

          </div>
          <div class="form-group"><label class="form-label">Дети:</label>
