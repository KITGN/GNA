          <div class="form-buttons">
            <button type="submit" class="form-btn save-btn">Добавить</button>
            <button type="button" class="form-btn cancel-btn" id="cancelAddBtn">Отмена</button>
          </div>
        </form>
      `;

        document.body.appendChild(editPanel);

        editPanel.style.left = "50%";
        editPanel.style.top = "50%";
        editPanel.style.transform = "translate(-50%, -50%) scale(0.9)";

        const dayInput = document.getElementById("addBirthDay");
        const yearInput = document.getElementById("addBirthYear");

        [dayInput, yearInput].forEach((input) => {
          input.addEventListener("input", function (e) {
            // Удаляем все нецифровые символы
            this.value = this.value.replace(/\D/g, "");
          });
        });

        setTimeout(() => {
          editPanel.classList.add("active");
        }, 10);

        const generationSelect = document.getElementById("addGeneration");
        const currentGeneration = parseInt(generationSelect.value);

        updateParentsLists(currentGeneration);
        updateChildrenList(currentGeneration);
        // РАЗМЕР ФАЙЛА
        document
          .getElementById("addPhoto")
          .addEventListener("change", (e) =>
            handleImagePreviewWithCompression(e, "addPhotoPreview", 900, 1200),
          );

        const addPersonForm = document.getElementById("addPersonForm");
        addPersonForm.addEventListener("submit", function (e) {
          e.preventDefault();
          addNewPerson();
          hideAddPersonForm();
        });

        document
          .getElementById("cancelAddBtn")
          .addEventListener("click", hideAddPersonForm);

        generationSelect.addEventListener("change", updateGenerationLists);
      }

      function updateGenerationLists() {
        const generationSelect = document.getElementById("addGeneration");
        const currentGeneration = parseInt(generationSelect.value);

        const maleTitle = document.querySelector(
          "#parentsSelection .parents-columns .parents-column:first-child .parents-column-title",
        );
        const femaleTitle = document.querySelector(
          "#parentsSelection .parents-columns .parents-column:last-child .parents-column-title",
        );

        if (maleTitle && femaleTitle) {
          const parentGeneration =
            currentGeneration - 1 > 0 ? currentGeneration - 1 : 0;
          maleTitle.textContent = `Мужчины (поколение ${parentGeneration})`;
          femaleTitle.textContent = `Женщины (поколение ${parentGeneration})`;
        }

        updateParentsLists(currentGeneration);
        updateChildrenList(currentGeneration);
      }

      function handleImagePreviewWithCompression(
        event,
        previewId,
        maxWidth,
        maxHeight,
      ) {
        const file = event.target.files[0];
        if (!file) return;

        const previewDiv = document.getElementById(previewId);
        previewDiv.innerHTML =
          '<div style="color: #a0a0a0; font-size: 12px; padding: 10px;">Сжатие изображения...</div>';

        const reader = new FileReader();
        reader.onload = function (e) {
          const img = new Image();
          img.onload = function () {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            let width = img.width;
            let height = img.height;

            if (width > maxWidth || height > maxHeight) {
              const ratio = Math.min(maxWidth / width, maxHeight / height);
              width = Math.floor(width * ratio);
              height = Math.floor(height * ratio);
            }

            canvas.width = width;
            canvas.height = height;

            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, width, height);

            ctx.drawImage(img, 0, 0, width, height);

            let quality = 0.7;

            if (file.size > 5 * 1024 * 1024) {
              quality = 0.5;
            } else if (file.size > 2 * 1024 * 1024) {
              quality = 0.6;
            } else if (file.size > 1 * 1024 * 1024) {
              quality = 0.65;
            }

            let compressedDataUrl = canvas.toDataURL("image/jpeg", quality);

            const base64Length =
              compressedDataUrl.length - (compressedDataUrl.indexOf(",") + 1);
            const padding =
              compressedDataUrl.charAt(compressedDataUrl.length - 2) === "="
                ? 2
                : 1;
            const fileSize = Math.floor(base64Length * 0.75) - padding;

            if (fileSize > 500 * 1024) {
              quality = Math.max(0.3, quality - 0.1);
              compressedDataUrl = canvas.toDataURL("image/jpeg", quality);
            }

            if (fileSize > 300 * 1024) {
              width = Math.floor(width * 0.8);
              height = Math.floor(height * 0.8);
              canvas.width = width;
              canvas.height = height;
              ctx.fillStyle = "white";
              ctx.fillRect(0, 0, width, height);
              ctx.drawImage(img, 0, 0, width, height);
              compressedDataUrl = canvas.toDataURL("image/jpeg", 0.4);
            }

            previewDiv.innerHTML = "";
            const previewImg = document.createElement("img");
            previewImg.src = compressedDataUrl;
            previewImg.style.maxWidth = "100px";
            previewImg.style.maxHeight = "100px";
            previewImg.style.borderRadius = "4px";
            previewImg.style.marginTop = "5px";
            previewImg.setAttribute("draggable", "false");
            previewImg.style.pointerEvents = "none";

            const infoDiv = document.createElement("div");
            infoDiv.style.fontSize = "11px";
            infoDiv.style.color = "#a0a0a0";
            infoDiv.style.marginTop = "5px";
            infoDiv.innerHTML = `Сжато до: ${width}×${height}px`;

            previewDiv.appendChild(previewImg);
            previewDiv.appendChild(infoDiv);

            const fileInput = event.target;
            fileInput.dataset.compressedImage = compressedDataUrl;
          };

          img.onerror = function () {
            previewDiv.innerHTML =
              '<div style="color: #ff6b6b; font-size: 12px; padding: 10px;">Ошибка загрузки изображения</div>';
          };

          img.src = e.target.result;
        };

        reader.onerror = function () {
          previewDiv.innerHTML =
            '<div style="color: #ff6b6b; font-size: 12px; padding: 10px;">Ошибка чтения файла</div>';
        };

        reader.readAsDataURL(file);
      }

      function hideAddPersonForm() {
        const editPanel = document.getElementById("editPanel");
        if (editPanel) {
          editPanel.classList.remove("active");
          setTimeout(() => {
            if (editPanel.parentNode) {
              editPanel.parentNode.removeChild(editPanel);
            }
          }, 200);
        }
        parentsPage = { male: 1, female: 1 };
        childrenPage = 1;
      }

      function addNewPerson() {
        const surname = document.getElementById("addSurname").value.trim();
        const firstname = document.getElementById("addFirstname").value.trim();
        const middlename = document
          .getElementById("addMiddlename")
          .value.trim();
        const day = document.getElementById("addBirthDay").value.trim();
        const month = document.getElementById("addBirthMonth").value;
        const year = document.getElementById("addBirthYear").value.trim();

        // Формируем дату
        let birthDate = "";
        if (day || month || year) {
          // Добавляем ведущие нули если нужно
          const formattedDay = day.padStart(2, "0");
          const formattedYear = year.padStart(4, "20"); // Если ввели 90, будет 2090

          birthDate = `${formattedDay}.${month}.${formattedYear}`;
        }

        const birthPlace = document
          .getElementById("addBirthPlace")
          .value.trim();
        const profession = document
          .getElementById("addProfession")
          .value.trim();
        let generation = parseInt(
          document.getElementById("addGeneration").value,
        );
        const gender = document.getElementById("addGender").value;

        const selectedMaleParent = document.querySelector(
          'input[name="maleParent"]:checked',
        );
        const selectedFemaleParent = document.querySelector(
          'input[name="femaleParent"]:checked',
        );
        const selectedParents = [];

        if (selectedMaleParent)
          selectedParents.push(parseInt(selectedMaleParent.value));
        if (selectedFemaleParent)
          selectedParents.push(parseInt(selectedFemaleParent.value));

        const selectedChildren = [];
        document
          .querySelectorAll(".children-checkbox:checked")
          .forEach((checkbox) =>
            selectedChildren.push(parseInt(checkbox.value)),
          );

        if (!surname || !firstname) {
          showNotification("Заполните обязательные поля: Фамилия и Имя");
          return;
        }

        if (generation === 0) {
          familyMembers.forEach((member) => {
            member.generation += 1;
          });
          generation = 1;
          maxGeneration += 1;
        }

        if (generation > maxGeneration) {
          maxGeneration = generation;
        }

        const photoFile = document.getElementById("addPhoto");
        const existingGenMembers = familyMembers.filter(
          (m) => m.generation === generation,
        );
        const x =
          (existingGenMembers.length - (existingGenMembers.length - 1) / 2) *
          300;
        const y = (generation - 1) * 300;

        const newPerson = {
          id: nextId++,
          surname,
          firstname,
          middlename,
          birthDate,
          birthPlace,
          profession,
          gender,
          generation,
          parents: selectedParents,
          children: [],
          spouse: null,
          loves: [],
          position: existingGenMembers.length + 1,
          photo: null,
          photoColor: "#aaaaaa",
          x,
          y,
        };

        let filesToLoad = 0;
        let filesLoaded = 0;

        const hasPhoto =
          photoFile.files[0] || photoFile.dataset.compressedImage;

        if (hasPhoto) filesToLoad++;

        function completePersonAddition() {
          filesLoaded++;

          if (filesLoaded >= filesToLoad || filesToLoad === 0) {
            selectedParents.forEach((parentId) => {
              const parent = familyMembers.find((m) => m.id === parentId);
              if (parent) {
                if (!parent.children) parent.children = [];
                if (!parent.children.includes(newPerson.id)) {
                  parent.children.push(newPerson.id);
                }
              }
            });

            selectedChildren.forEach((childId) => {
              const child = familyMembers.find((m) => m.id === childId);
              if (child) {
                if (!child.parents) child.parents = [];
                if (!child.parents.includes(newPerson.id)) {
                  child.parents.push(newPerson.id);
                }
              }
              if (!newPerson.children.includes(childId)) {
                newPerson.children.push(childId);
              }
            });

            familyMembers.push(newPerson);

            generateFamilyTree();

            // editMode = false;
            // updateControlsVisibility();

            showNotification(
              `Добавлен: ${newPerson.surname} ${newPerson.firstname} ${newPerson.middlename}`,
            );
          }
        }

        if (photoFile.dataset.compressedImage) {
          newPerson.photo = photoFile.dataset.compressedImage;
          completePersonAddition();
        } else if (photoFile.files[0]) {
          const reader = new FileReader();
          reader.onload = function (e) {
            const img = new Image();
            img.onload = function () {
              const canvas = document.createElement("canvas");
              const ctx = canvas.getContext("2d");
              canvas.width = 900;
              canvas.height = 120;
              ctx.fillStyle = "white";
              ctx.fillRect(0, 0, 900, 1200);

              const imgRatio = img.width / img.height;
              const targetRatio = 900 / 1200;

              let drawWidth, drawHeight, offsetX, offsetY;

              if (imgRatio > targetRatio) {
                drawHeight = 120;
                drawWidth = 120 * imgRatio;
                offsetX = (900 - drawWidth) / 2;
                offsetY = 0;
              } else {
                drawWidth = 900;
                drawHeight = 900 / imgRatio;
                offsetX = 0;
                offsetY = (120 - drawHeight) / 2;
              }

              ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
              newPerson.photo = canvas.toDataURL("image/jpeg", 0.7);
              completePersonAddition();
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(photoFile.files[0]);
        } else if (!hasPhoto) {
          if (filesToLoad === 0) filesToLoad = 1;
          completePersonAddition();
        }
      }

      window.addEventListener("DOMContentLoaded", function () {
        loadInitialTree();
        updateControlsVisibility();
        bindControlButtons();
        initializeStarfield();
      });

      // В начале скрипта, после других переменных
      let starfield = null;
      let starsLayer1 = null;
      let starsLayer2 = null;
      let starsLayer3 = null;
      let starsLayerColors = null;

      // Функция для создания случайных позиций звезд
      function generateRandomPositions() {
        const positions = {};
        for (let i = 1; i <= 30; i++) {
          positions[`random-x${i}`] = Math.random() * 100;
          positions[`random-y${i}`] = Math.random() * 100;
        }
        return positions;
      }

      // Функция инициализации звездного неба
      function initializeStarfield() {
        const starfieldDiv = document.createElement("div");
        starfieldDiv.id = "starfield";

        // Создаем слои звезд
        const layer1 = document.createElement("div");
        layer1.className = "stars-layer-1";
        const layer2 = document.createElement("div");
        layer2.className = "stars-layer-2";
        const layer3 = document.createElement("div");
        layer3.className = "stars-layer-3";
        const layerColors = document.createElement("div");
        layerColors.className = "stars-layer-colors";

        // Создаем туманности
        const nebula1 = document.createElement("div");
        nebula1.className = "nebula nebula-1";
        const nebula2 = document.createElement("div");
        nebula2.className = "nebula nebula-2";
        const nebula3 = document.createElement("div");
        nebula3.className = "nebula nebula-3";

        // Добавляем все в контейнер
        starfieldDiv.appendChild(layer1);
        starfieldDiv.appendChild(layer2);
        starfieldDiv.appendChild(layer3);
        starfieldDiv.appendChild(layerColors);
        starfieldDiv.appendChild(nebula1);
        starfieldDiv.appendChild(nebula2);
        starfieldDiv.appendChild(nebula3);

        document.body.appendChild(starfieldDiv);

        // Сохраняем ссылки
        starfield = starfieldDiv;
        starsLayer1 = layer1;
        starsLayer2 = layer2;
        starsLayer3 = layer3;
        starsLayerColors = layerColors;

        // Устанавливаем случайные позиции звезд
        const positions = generateRandomPositions();
        for (const [key, value] of Object.entries(positions)) {
          document.documentElement.style.setProperty(`--${key}`, value);
        }

        // Начальное обновление позиций
        updateStarfieldPosition();
      }

      // Функция обновления позиций звездного неба
      function updateStarfieldPosition() {
        if (!starsLayer1 || !starsLayer2 || !starsLayer3 || !starsLayerColors)
          return;

        // Параллакс-эффект: разные слои двигаются с разной скоростью
        const parallax1 = 0.1; // Самые дальние - медленнее
        const parallax2 = 0.2;
        const parallax3 = 0.3; // Самые ближние - быстрее
        const parallaxColors = 0.15;

        // Рассчитываем смещение для каждого слоя
        const offsetX1 = offsetX * parallax1;
        const offsetY1 = offsetY * parallax1;
        const offsetX2 = offsetX * parallax2;
        const offsetY2 = offsetY * parallax2;
        const offsetX3 = offsetX * parallax3;
        const offsetY3 = offsetY * parallax3;
        const offsetXColors = offsetX * parallaxColors;
        const offsetYColors = offsetY * parallaxColors;

        // Масштабирование звезд (при увеличении они "приближаются")
        const scaleFactor1 = 1 + (scale - 1) * 0.1;
        const scaleFactor2 = 1 + (scale - 1) * 0.2;
        const scaleFactor3 = 1 + (scale - 1) * 0.3;
        const scaleFactorColors = 1 + (scale - 1) * 0.15;

        // Применяем трансформации
        starsLayer1.style.transform = `translate(${offsetX1}px, ${offsetY1}px) scale(${scaleFactor1})`;
        starsLayer2.style.transform = `translate(${offsetX2}px, ${offsetY2}px) scale(${scaleFactor2})`;
        starsLayer3.style.transform = `translate(${offsetX3}px, ${offsetY3}px) scale(${scaleFactor3})`;
        starsLayerColors.style.transform = `translate(${offsetXColors}px, ${offsetYColors}px) scale(${scaleFactorColors})`;
      }

      // Простой троттлинг для частых операций
      let lastAnimationFrame = 0;
      const TARGET_FPS = 60;
      const FRAME_TIME = 1000 / TARGET_FPS;

      function throttleAnimation(callback) {
        const now = Date.now();
        if (now - lastAnimationFrame >= FRAME_TIME) {
          lastAnimationFrame = now;
          requestAnimationFrame(callback);
        }
      }

      // Оптимизируем частые обновления в обработчике mousemove:
      document.addEventListener("mousemove", function (e) {
        if (isDraggingPerson && draggedPerson) {
          e.preventDefault();

          const treeContainerRect = treeContainer.getBoundingClientRect();
          const mouseX = e.clientX - treeContainerRect.left;
          const mouseY = e.clientY - treeContainerRect.top;

          const elementX = (mouseX - offsetX) / scale - dragOffsetX;
          const elementY = (mouseY - offsetY) / scale - dragOffsetY;

          draggedPerson.style.left = `${elementX}px`;
          draggedPerson.style.top = `${elementY}px`;

          updatePanelPosition();

          // Троттлинг перерисовки линий
          throttleAnimation(() => {
            drawConnections();
          });
        } else if (isDragging) {
          offsetX = e.clientX - startX;
          offsetY = e.clientY - startY;
          updateTreePosition();
          updatePanelPosition();
        }
      });

      function resetToDefaultZoom() {
        // Если уже на 100%, ничего не делаем
        if (Math.abs(scale - 1) < 0.01) {
          showNotification("Уже 100% масштаб");
          return;
        }

        // Сохраняем позицию, на которую смотрит пользователь
        const treeContainer = document.getElementById("treeContainer");
        const containerRect = treeContainer.getBoundingClientRect();

        // Координаты центра экрана
        const centerX = containerRect.width / 2;
        const centerY = containerRect.height / 2;

        // Что видно в центре экрана сейчас (в координатах дерева)
        const currentCenterX = (centerX - offsetX) / scale;
        const currentCenterY = (centerY - offsetY) / scale;

        // Вычисляем новые offset так, чтобы этот же объект остался в центре
        const targetScale = 1;
        const targetOffsetX = centerX - currentCenterX * targetScale;
        const targetOffsetY = centerY - currentCenterY * targetScale;

        // Плавная анимация
        const duration = 350;
        const startScale = scale;
        const startOffsetX = offsetX;
        const startOffsetY = offsetY;
        const startTime = Date.now();

        function easeOutCubic(t) {
          return 1 - Math.pow(1 - t, 3);
        }

        function animate() {
          const currentTime = Date.now();
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const easedProgress = easeOutCubic(progress);

          // Плавно меняем и scale и offset
          scale = startScale + (targetScale - startScale) * easedProgress;
          offsetX =
            startOffsetX + (targetOffsetX - startOffsetX) * easedProgress;
          offsetY =
            startOffsetY + (targetOffsetY - startOffsetY) * easedProgress;

          // Обновляем
          updateTreePosition();
          updateStarfieldPosition(true);

          // Перерисовываем линии при значительном изменении
          if (Math.abs(scale - startScale) > 0.1) {
            drawConnections();
          }

          // Продолжаем анимацию
          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            // Финализируем
            scale = targetScale;
            offsetX = targetOffsetX;
            offsetY = targetOffsetY;
            updateTreePosition();
            drawConnections();
            showNotification("Масштаб сброшен к 100%");
          }
        }

        requestAnimationFrame(animate);
      }

      // Функция плавной анимации к позиции
      function animateToPosition(targetScale, targetX, targetY) {
        // Параметры анимации
        const duration = 500; // 0.5 секунды
        const startScale = scale;
        const startX = offsetX;
        const startY = offsetY;
        const startTime = Date.now();

        // Easing функция для плавности
        function easeInOutCubic(t) {
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animate() {
          const currentTime = Date.now();
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const easedProgress = easeInOutCubic(progress);

          // Интерполируем значения
          scale = startScale + (targetScale - startScale) * easedProgress;
          offsetX = startX + (targetX - startX) * easedProgress;
          offsetY = startY + (targetY - startY) * easedProgress;

          // Обновляем позиции
          updateTreePosition();
          updateStarfieldPosition(true); // Немедленное обновление звезд

          // Если анимация не завершена, продолжаем
          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            // Завершаем анимацию
            scale = targetScale;
            offsetX = targetX;
            offsetY = targetY;
            updateTreePosition();
            drawConnections();
          }
        }

        // Запускаем анимацию
        requestAnimationFrame(animate);
      }
    </script>
